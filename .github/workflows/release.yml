name: Release Electron

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.0.7
        required: true
        default: v0.0.7
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows ${{ matrix.label }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows 7
            electron: 22.3.27
            arch: ia32
            suffix: Win7-x86
          - label: Windows 10 and 11
            electron: 37.2.3
            arch: x64
            suffix: Win10-11-x64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release tag
        shell: pwsh
        run: |
          if ("${{ env.RELEASE_TAG }}" -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag must use the vMAJOR.MINOR.PATCH format."
          }

      - name: Install dependencies
        run: npm ci

      - name: Set package version
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_TAG }}".Substring(1)
          npm pkg set version=$version

      - name: Run tests
        run: npm run test:ci

      - name: Build installer
        shell: pwsh
        run: |
          npm run build
          npx electron-builder --win nsis --${{ matrix.arch }} `
            --publish never `
            --config.electronVersion=${{ matrix.electron }} `
            --config.win.artifactName=Yunjiaokou-Patrol-${{ env.RELEASE_TAG }}-${{ matrix.suffix }}.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suffix }}
          path: dist/Yunjiaokou-Patrol-${{ env.RELEASE_TAG }}-${{ matrix.suffix }}.exe
          if-no-files-found: error

  build-macos:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release tag
        run: |
          [[ "${{ env.RELEASE_TAG }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Tag must use the vMAJOR.MINOR.PATCH format." >&2
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Set package version
        run: |
          tag="${{ env.RELEASE_TAG }}"
          npm pkg set version="${tag#v}"

      - name: Run tests
        run: npm run test:ci

      - name: Build arm64 DMG
        run: |
          npm run build
          npx electron-builder --mac dmg --arm64 \
            --publish never \
            --config.electronVersion=22.3.27 \
            --config.mac.artifactName=Yunjiaokou-Patrol-${{ env.RELEASE_TAG }}-macOS-arm64.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macOS-arm64
          path: dist/Yunjiaokou-Patrol-${{ env.RELEASE_TAG }}-macOS-arm64.dmg
          if-no-files-found: error

  build-linux:
    name: Linux and UOS aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release tag
        run: |
          [[ "${{ env.RELEASE_TAG }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Tag must use the vMAJOR.MINOR.PATCH format." >&2
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Set package version
        run: |
          tag="${{ env.RELEASE_TAG }}"
          npm pkg set version="${tag#v}"

      - name: Run tests
        run: npm run test:ci

      - name: Build ARMv8.0 AppImage runtime without LSE
        run: |
          sudo apt-get update
          sudo apt-get install --yes llvm
          mkdir -p .ci/appimage-tools
          bash scripts/build-uos-appimage-runtime.sh .ci/appimage-tools

      - name: Build arm64 AppImage and portable archive
        env:
          APPIMAGE_TOOLS_PATH: ${{ github.workspace }}/.ci/appimage-tools
        run: |
          npm run build
          npx electron-builder --linux AppImage tar.gz --arm64 \
            --publish never \
            --config.electronVersion=22.3.27 \
            --config.linux.artifactName='Yunjiaokou-Patrol-${{ env.RELEASE_TAG }}-Linux-aarch64.${ext}'

      - name: Verify static AppImage runtime extraction
        run: |
          appimage="dist/Yunjiaokou-Patrol-${RELEASE_TAG}-Linux-aarch64.AppImage"
          runtime="${GITHUB_WORKSPACE}/.ci/appimage-tools/runtimes/runtime-arm64"
          test -f "$appimage"
          test -x "$runtime"
          runtime_size="$(stat --format=%s "$runtime")"
          cmp --bytes="$runtime_size" "$runtime" "$appimage"
          if readelf -l "$runtime" | grep -q 'Requesting program interpreter'; then
            echo "AppImage runtime must be statically linked." >&2
            exit 1
          fi
          if llvm-objdump --triple=aarch64 --disassemble "$runtime" \
            | grep -Eiq '[[:space:]](cas[a-z]*|ldadd[a-z]*|swp[a-z]*)[[:space:]]'; then
            echo "AppImage runtime must not contain ARM LSE instructions." >&2
            exit 1
          fi
          verification_dir="$(mktemp -d)"
          cp "$appimage" "$verification_dir/qh-duty-desk.AppImage"
          cd "$verification_dir"
          chmod +x qh-duty-desk.AppImage
          ./qh-duty-desk.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/qh-duty-desk
          test -f squashfs-root/resources/app.asar

      - name: Upload Linux and UOS packages
        uses: actions/upload-artifact@v4
        with:
          name: Linux-UOS-aarch64
          path: |
            dist/Yunjiaokou-Patrol-${{ env.RELEASE_TAG }}-Linux-aarch64.AppImage
            dist/Yunjiaokou-Patrol-${{ env.RELEASE_TAG }}-Linux-aarch64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
      - build-linux
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[].id' \
              | xargs -r -I{} gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/{}"
            gh release upload "$TAG" release-files/* --clobber
          else
            gh release create "$TAG" release-files/* \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi
